<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>miskshi</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@600;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{--bg:#fff;--fg:#111;--mut:#6b6b6b;--ph:#e9e9e9;--ln:#e2e2e2;--fld:#e8e8e8;--g:#34d44b;--g2:#47e344;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1214;--fg:#f2f2f2;--mut:#9aa0a6;--ph:#23282c;--ln:#2d3338;--fld:#1d2226}}
:root[data-theme="dark"]{--bg:#0f1214;--fg:#f2f2f2;--mut:#9aa0a6;--ph:#23282c;--ln:#2d3338;--fld:#1d2226}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px Inter,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
a{color:inherit;text-decoration:none}button,input{font:inherit;color:inherit}button{cursor:pointer}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
.d{font-family:Unbounded,Inter,sans-serif;font-weight:700;text-transform:uppercase;font-size:20px}
.ph{background:var(--ph);border-radius:8px}
.nv{height:59px;display:flex;align-items:center;cursor:pointer;font-weight:500}
.nv.on{text-decoration:underline;text-decoration-color:var(--g);text-underline-offset:4px}
#mega{display:none;position:absolute;left:0;right:0;top:59px;background:var(--bg);border-bottom:1px solid var(--ln);padding:32px 60px 30px}
#mega.on{display:flex;gap:130px}
#mega h4{font-size:20px;font-weight:600;margin:0 0 20px}#mega a{display:block;margin-bottom:20px}
.ch{border:1px solid #cfcfcf;border-radius:8px;background:var(--bg);padding:0 19px;height:40px;font-weight:500;font-size:15px}
.ch.on{border:1.5px solid var(--fg)}.ch.sel{background:var(--fg);color:var(--bg)}
.btn{height:56px;border-radius:8px;font-weight:600;border:1.5px solid var(--fg);background:transparent}
.btn.g{background:var(--g);border-color:var(--g);color:#0b240f}
.tile .h{opacity:0;transition:.2s}.tile:hover .h{opacity:1}
#sp{position:fixed;inset:0;z-index:50;pointer-events:none}#sp.on{pointer-events:auto}
#sp .sc{position:absolute;inset:0;background:#0009;opacity:0;transition:.3s}#sp.on .sc{opacity:1}
#sp aside{position:absolute;right:0;top:0;bottom:0;width:min(440px,100%);background:var(--bg);padding:48px 40px;transform:translateX(100%);transition:.35s}#sp.on aside{transform:none}
.fld{display:block;width:100%;height:48px;border-radius:8px;background:var(--fld);border:0;padding:0 14px;margin:6px 0 20px}
#lk{position:fixed;inset:0;z-index:70;background:#0c1410;color:#fff;overflow:auto;transform:translateY(-101%);transition:transform .45s cubic-bezier(.7,0,.2,1)}
#lk.on{transform:none}
.lq{max-width:760px;margin:0 auto;padding:12vh 24px 40px;animation:dn .35s cubic-bezier(.2,.9,.3,1) both}
@keyframes dn{from{transform:translateY(-60px);opacity:0;filter:blur(6px)}to{transform:none;opacity:1;filter:none}}
.lc{border:1.5px solid #ffffff40;border-radius:999px;padding:12px 22px;margin:0 10px 10px 0;background:transparent;color:#fff;font-weight:500;transition:.15s}
.lc:hover{border-color:var(--g2)}.lc.on{background:var(--g2);color:#000;border-color:var(--g2)}
.sl{position:absolute;top:0;bottom:0;width:12.5%;background:var(--g2);transform:translateY(-101%);animation:sl .75s cubic-bezier(.7,0,.2,1) forwards;animation-delay:calc(var(--i)*.05s)}
@keyframes sl{0%{transform:translateY(-101%)}45%,55%{transform:none}100%{transform:translateY(101%)}}
.fl{position:fixed;inset:0;background:#fff;pointer-events:none;animation:fl .75s both}
@keyframes fl{0%,35%{opacity:0}48%{opacity:1}100%{opacity:0}}
.pz{width:min(360px,88vw);margin:0 auto;border:2px solid var(--rc);border-radius:12px;padding:16px;background:#111a15;animation:drop .6s .5s cubic-bezier(.2,1.4,.4,1) both,pu 1.6s 1.1s infinite}
@keyframes drop{from{transform:translateY(-130%) scale(.9);opacity:0}to{transform:none;opacity:1}}
@keyframes pu{50%{box-shadow:0 0 70px var(--rc)}0%,100%{box-shadow:0 0 25px var(--rc)}}
.bar{height:4px;background:#ffffff25;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--g2);animation:bw 2.4s linear forwards}
@keyframes bw{to{width:100%}}
#ts{position:fixed;left:50%;bottom:28px;transform:translate(-50%,120px);background:#111;color:#fff;padding:12px 20px;border-radius:8px;z-index:80;transition:.3s;font-weight:500}#ts.on{transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="top" onmouseleave="mg()">
  <header class="flex items-center justify-between gap-3 px-5 lg:px-[60px] h-[59px]">
    <div class="flex items-center gap-4 lg:gap-[68px]">
      <button data-a="menu" class="bg-transparent border-0 p-0 font-medium">☰</button>
      <nav class="hidden lg:flex gap-[23px]" id="nav"><span class="nv" data-n="Men">Men</span><span class="nv" data-n="Women">Women</span><span class="nv" data-n="Collections">Collections</span><span class="nv" data-n="Accessories">Accessories</span></nav>
    </div>
    <a href="#home" class="d lg:absolute lg:left-1/2 lg:-translate-x-1/2" style="color:var(--g);font-size:22px;letter-spacing:-.06em;text-transform:lowercase">miskshi</a>
    <div class="flex items-center gap-4 lg:gap-[38px]">
      <input id="q" placeholder="Search" class="hidden md:block w-[274px] h-8 rounded px-2.5 border-0" style="background:var(--fld)">
      <div class="flex gap-5 lg:gap-7 font-medium whitespace-nowrap"><button data-a="wish" class="bg-transparent border-0 p-0" id="hw">♡</button><button data-a="sign" class="bg-transparent border-0 p-0">Profile</button><a href="#bag" id="hb">Bag</a></div>
    </div>
  </header>
  <div id="mega"></div>
</div>
<main id="app"></main>
<footer class="px-5 lg:px-[60px] py-10 mt-16 text-sm" style="color:var(--mut);border-top:1px solid var(--ln)">© miskshi · dummy storefront · 30-day returns · Cash On Delivery</footer>

<div id="sp"><div class="sc" data-a="sx"></div><aside>
  <h2 id="st" class="text-[28px] font-bold m-0 mb-8">Sign in</h2>
  <label class="text-sm" style="color:var(--mut)">Email</label><input id="se" class="fld" type="email" placeholder="you@email.com">
  <label class="text-sm" style="color:var(--mut)">Password</label><input class="fld" type="password" placeholder="••••••••">
  <button class="btn g w-full" style="height:52px" data-a="in">Sign in</button>
  <p class="mt-5"><button id="sw" data-a="mode" class="bg-transparent border-0 p-0 underline">New here? Sign up</button></p>
  <hr class="my-8" style="border:0;border-top:1px solid var(--ln)">
  <button class="btn w-full" style="height:52px" data-a="guest">Or continue as guest</button>
</aside></div>
<div id="lk"></div>
<div id="ts"></div>

<script>
const $=s=>document.querySelector(s),money=n=>"Rs. "+n.toLocaleString("en-IN");
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const NAMES=["Void Tee","Raven Tee","Chrome Tee","Static Tee","Knight Tee","Ash Tee","Halo Tee","Rogue Tee","Mono Tee","Pixel Tee","Relic Tee","Neon Tee"],COL=["Black","White","Grey","Green"],PR=[799,899,999,1099,1199,1299,1499];
const P=Array.from({length:24},(_,i)=>({id:i+1,name:NAMES[i%12]+(i>11?" II":""),price:PR[(i*3)%7],fit:i%3?"Oversized":"Regular",col:COL[i%4],g:i%2?"Women":"Men"}));
let S={bag:ld("mk-bag",[]),wish:new Set(ld("mk-wish",[])),f:{},sort:"Newest",n:8,crumb:"T-shirts",open:"",sz:"M",ft:"Regular",acc:""};
const save=()=>{sv("mk-bag",S.bag);sv("mk-wish",[...S.wish])};
const toast=t=>{const e=$("#ts");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2200)};
const FO={fit:["Regular","Oversized"],col:COL,price:[["u","Under Rs. 1,099"],["m","Rs. 1,099 & above"]],g:["Men","Women"]};
const tile=(p,big)=>`<a href="#product-${p.id}" class="tile block relative"><div class="ph w-full" style="aspect-ratio:${big?"420/340":"300/340"}"></div><button data-a="heart" data-v="${p.id}" class="h absolute top-3 right-3 w-9 h-9 rounded-full border-0 bg-white text-black">${S.wish.has(p.id)?"♥":"♡"}</button><p class="font-medium mt-3 mb-1">${p.name}</p><p class="text-sm m-0" style="color:var(--mut)">${money(p.price)}</p></a>`;
function list(){let l=P.filter(p=>(!S.f.fit||p.fit==S.f.fit)&&(!S.f.col||p.col==S.f.col)&&(!S.f.g||p.g==S.f.g)&&(!S.f.q||(p.name+p.col).toLowerCase().includes(S.f.q))&&(!S.f.price||(S.f.price=="u"?p.price<1099:p.price>=1099)));
 if(S.sort.includes("low"))l.sort((a,b)=>a.price-b.price);else if(S.sort.includes("high"))l.sort((a,b)=>b.price-a.price);else l.sort((a,b)=>b.id-a.id);return l}
const VIEW={
home:()=>`<section class="relative flex flex-col justify-end overflow-hidden min-h-[560px] lg:h-[808px]" style="background:radial-gradient(circle at 55% 40%,#3b4a58,#2c3844 65%);color:#fff">
 <svg class="absolute left-1/2 top-[12%] -translate-x-1/2 w-[min(420px,70%)] opacity-90" viewBox="0 0 200 190"><path d="M60 8 40 14 5 50l22 28 18-12v118h110V66l18 12 22-28-35-36-20-6c-4 14-20 22-40 22S64 22 60 8z" fill="#3d4650" stroke="#34d44b" stroke-opacity=".5" stroke-width="2"/></svg>
 <div class="absolute left-5 lg:left-[60px] top-8 lg:top-12"><i style="font:700 34px Caveat,cursive;color:var(--g2)">miskshi presents</i><h1 class="d m-0 text-[clamp(28px,5vw,64px)] leading-none normal-case" style="color:var(--g2)">The Miscelenious Shirt</h1></div>
 <div class="absolute right-5 lg:right-[60px] bottom-20 text-right"><i style="font:700 34px Caveat,cursive;color:var(--g2)">Designed with</i><div class="d text-[clamp(28px,5vw,64px)] normal-case" style="color:var(--g2)">Tren Tech</div></div>
 <div class="flex justify-between px-5 lg:px-[60px] py-4 font-medium text-sm lg:text-base relative"><span>30-day returns</span><span>Cash On Delivery</span><span>Free shipping over 999</span></div></section>
 <section class="grid md:grid-cols-2">${[["The Dark Kinight Collection","linear-gradient(160deg,#6a7279,#20262b)"],["The White Knight Collection","linear-gradient(160deg,#d7dade,#8b939b)"]].map(c=>`<div class="relative h-[420px] lg:h-[760px] flex items-end justify-between p-6 text-white" style="background:${c[1]}"><div class="absolute inset-0" style="background:linear-gradient(180deg,#2c384400 87%,#2c3844)"></div><b class="relative text-xl lg:text-2xl font-semibold">${c[0]}</b><button data-a="shop" data-v="${c[0]}" class="relative border-0 rounded-lg px-7 py-3 text-xl lg:text-2xl text-black" style="background:var(--g2)">Shop</button></div>`).join("")}</section>
 <section class="px-5 lg:px-[60px] pt-8"><h2 class="d py-4 m-0 lg:text-[28px]">New Featured Products</h2><div class="grid md:grid-cols-3 gap-[30px]">${P.slice(0,3).map(p=>tile(p,1)).join("")}</div></section>
 <section class="px-5 lg:px-[60px] pt-8"><h2 class="d py-4 m-0 lg:text-[28px]">New drops</h2><div class="grid grid-cols-2 lg:grid-cols-4 gap-5 lg:gap-10">${P.slice(3,11).map(p=>tile(p)).join("")}</div></section>`,
shop:()=>{const l=list(),f=S.f,lab={fit:f.fit||"Fit",col:f.col||"Colour",price:f.price?FO.price.find(x=>x[0]==f.price)[1]:"Price",g:"Gender: "+(f.g||"all")};
 const chips=Object.keys(FO).map(k=>`<div class="relative"><button data-a="open" data-v="${k}" class="ch ${(k=="g"?f.g:f[k])?"sel":""}">${lab[k]}</button>${S.open==k?`<div class="absolute z-10 top-11 left-0 rounded-lg p-2 min-w-[190px]" style="background:var(--bg);border:1px solid var(--ln);box-shadow:0 8px 24px #0002">${[["",k=="g"?"All":"Any"],...FO[k].map(o=>Array.isArray(o)?o:[o,o])].map(o=>`<button data-a="setf" data-v="${k}|${o[0]}" class="block w-full text-left bg-transparent border-0 p-2 rounded hover:bg-black/5">${o[1]}</button>`).join("")}</div>`:""}</div>`).join("");
 return `<div class="px-5 lg:px-[60px] py-1.5 flex flex-wrap items-center justify-between gap-3" style="border-bottom:1px solid var(--ln)"><div class="flex flex-wrap gap-3"><button data-a="clr" class="ch">⚲ Filter</button>${chips}</div><div class="relative"><button data-a="open" data-v="sort" class="bg-transparent border-0 p-0">Sort: ${S.sort} ▾</button>${S.open=="sort"?`<div class="absolute right-0 top-8 z-10 rounded-lg p-2 min-w-[200px]" style="background:var(--bg);border:1px solid var(--ln);box-shadow:0 8px 24px #0002">${["Newest","Price: low to high","Price: high to low"].map(o=>`<button data-a="sort" data-v="${o}" class="block w-full text-left bg-transparent border-0 p-2 rounded hover:bg-black/5">${o}</button>`).join("")}</div>`:""}</div></div>
 <p class="px-5 lg:px-[60px] mt-[60px] mb-5 text-sm" style="color:var(--mut)">Home / ${S.crumb}${f.q?` / “${f.q}”`:""} · ${l.length} items</p>
 <div class="px-5 lg:px-[60px] grid grid-cols-2 lg:grid-cols-4 gap-x-5 lg:gap-x-10 gap-y-10">${l.slice(0,S.n).map(p=>tile(p)).join("")||"<p>No tees match. Try clearing filters.</p>"}</div>
 ${l.length>S.n?`<div class="text-center mt-12"><button data-a="more" class="btn w-[220px]">Load more</button></div>`:""}`},
bag:()=>{const n=S.bag.reduce((a,b)=>a+b.qty,0),sub=S.bag.reduce((a,b)=>a+b.qty*b.price,0),ship=!sub||sub>=999?0:99;
 return `<div class="px-5 lg:px-[60px] pt-11"><h1 class="m-0 text-[32px] font-bold">Your bag (${n})</h1><div class="grid lg:grid-cols-[1fr_460px] gap-10 lg:gap-20 mt-10">
 <div>${S.bag.map((b,i)=>`<div class="flex gap-6 py-6" style="border-bottom:1px solid var(--ln)"><div class="ph shrink-0 w-[100px] h-[125px] lg:w-[120px] lg:h-[150px]"${b.rarity?` style="outline:2px solid ${R[b.rarity].c}"`:""}></div><div><p class="m-0 font-semibold text-lg">${b.name}</p><p class="my-1">${money(b.price)}</p><p class="m-0 text-sm" style="color:var(--mut)">Size ${b.size}, ${b.fit}${b.rarity?` · <b style="color:${R[b.rarity].c}">${R[b.rarity].n} #${b.serial}/${R[b.rarity].t}</b>`:""}</p><div class="ch inline-flex items-center gap-4 mt-4"><button data-a="qty" data-v="${i}|-1" class="bg-transparent border-0">−</button>${b.qty}<button data-a="qty" data-v="${i}|1" class="bg-transparent border-0">+</button></div></div></div>`).join("")||`<p>Your bag is empty. <a class="underline" href="#shop">Keep shopping</a></p>`}</div>
 <div class="rounded-xl p-8 self-start" style="border:1px solid var(--ln)"><h3 class="m-0 mb-6 text-[22px] font-semibold">Summary</h3><p class="flex justify-between"><span>Subtotal</span>${money(sub)}</p><p class="flex justify-between"><span>Shipping</span>${ship?money(ship):"Free"}</p><hr style="border:0;border-top:1px solid var(--ln)" class="my-5"><p class="flex justify-between text-xl font-semibold m-0 mb-6"><span>Total</span>${money(sub+ship)}</p><button data-a="pay" class="btn g w-full">Pay securely</button><p class="text-sm mt-4 mb-0" style="color:var(--mut)">30-day returns</p></div></div></div>`},
product:id=>{const p=P.find(x=>x.id==id)||P[0],ch=(a,v,w)=>`<button data-a="${a}" data-v="${v}" class="ch ${(a=="sz"?S.sz:S.ft)==v?"on":""}" style="height:48px;width:${w}px;padding:0">${v}</button>`;
 return `<div class="px-5 lg:px-[60px] pt-11 grid lg:grid-cols-[640px_1fr] gap-10 lg:gap-[80px]"><div class="ph h-[480px] lg:h-[800px] flex items-center justify-center text-xl font-medium" style="color:#8a8a8a">Main photo</div><div class="lg:max-w-[600px]">
 <h1 class="m-0 text-[40px] font-bold">${p.name}</h1><p class="my-3 text-[28px]">${money(p.price)}</p>
 <p class="mt-8 mb-2 text-sm font-medium" style="color:var(--mut)">Size</p><div class="flex gap-3">${["S","M","L","XL"].map(s=>ch("sz",s,64)).join("")}</div>
 <p class="mt-6 mb-2 text-sm font-medium" style="color:var(--mut)">Fit</p><div class="flex gap-3">${["Regular","Oversized"].map(s=>ch("ft",s,140)).join("")}</div>
 <div class="flex gap-4 mt-10"><button data-a="add" data-v="${p.id}" class="btn g flex-1">Add to bag</button><button data-a="heart" data-v="${p.id}" class="btn w-[200px]">${S.wish.has(p.id)?"♥":"♡"} Wishlist</button></div>
 <div class="mt-12">${[["Details","100% cotton, 240 GSM, screen-printed. Dummy copy."],["Size guide","S 38 · M 40 · L 42 · XL 44 (chest, inches)."],["Returns","30-day returns. Cash On Delivery available."]].map(a=>`<div style="border-top:1px solid var(--ln)"><button data-a="acc" data-v="${a[0]}" class="w-full flex justify-between bg-transparent border-0 py-5 font-medium">${a[0]}<span class="text-xl">${S.acc==a[0]?"−":"+"}</span></button>${S.acc==a[0]?`<p class="mt-0 pb-5" style="color:var(--mut)">${a[1]}</p>`:""}</div>`).join("")}<div style="border-top:1px solid var(--ln)"></div></div></div></div>`}};
function render(){const h=location.hash.slice(1)||"home",v=h.startsWith("product-")?VIEW.product(h.slice(8)):(VIEW[h]||VIEW.home)();$("#app").innerHTML=v;
 const n=S.bag.reduce((a,b)=>a+b.qty,0);$("#hb").textContent=n?`Bag (${n})`:"Bag";$("#hw").textContent=S.wish.size?`♥ ${S.wish.size}`:"♡"}
addEventListener("hashchange",()=>{S.open="";render();scrollTo(0,0)});
/* mega menu */
const MG={cols:[["Lower Wear",["Sweatpants","Shorts","Longue wear","Jeans","Jeans","Pants"]],["Upper Wear",["Sweatshits","Tshirts","Shirts","Jackets","Vest"]],["Accessories",["Cap","Wallet","Scarfs","Belt","Necklace","Bracelet"]],["Footwear",["Shoes","Socks","Laces","Shoe charm"]]]};
function mg(n){document.querySelectorAll(".nv").forEach(e=>e.classList.toggle("on",e.dataset.n==n));const m=$("#mega");if(!n){m.classList.remove("on");return}
 m.innerHTML=MG.cols.map(c=>`<div class="w-[115px]"><h4>${c[0]}</h4>${[...c[1],...(n=="Women"&&c[0]=="Lower Wear"?["Skirts"]:[])].map(x=>`<a href="#shop" data-a="cat" data-v="${x}">${x}</a>`).join("")}<a href="#shop" data-a="cat" data-v="All" class="font-medium">Shop all</a></div>`).join("")+`<div class="ml-auto relative w-[219px] h-[278px] rounded-lg overflow-hidden flex items-end" style="background:linear-gradient(170deg,#c9cde0,#8e97b3 60%,#3a4258)"><button data-a="lucky" class="w-full h-[43px] rounded-lg border-0 text-2xl text-black" style="background:var(--g2)">feeling lucky?</button></div>`;m.classList.add("on")}
$("#nav").addEventListener("mouseover",e=>{const n=e.target.dataset.n;if(n)mg(n)});
$("#q").addEventListener("keydown",e=>{if(e.key=="Enter"){S.f={q:e.target.value.toLowerCase()};S.crumb="Search";S.n=8;location.hash=="#shop"?render():location.hash="shop"}});
/* feeling lucky */
const R={uncommon:{n:"Uncommon",t:1000,off:.2,c:"#34d44b",w:70},rare:{n:"Rare",t:100,off:.35,c:"#4da6ff",w:22},epic:{n:"Epic",t:50,off:.5,c:"#b66dff",w:7.5},legendary:{n:"Legendary",t:1,off:.7,c:"#ffd23f",w:.5}};
const Q=[{k:"a",q:"yo, what’s your aesthetic?",o:["Streetwear","Gothic","Y2K","Techwear","Grunge","Minimal"]},{k:"s",q:"what shows or movies are you into?",o:["Anime","Sci-fi","Noir","Horror","Crime","Rom-com"],m:1},{k:"f",q:"what fit do you rock with?",o:["Oversized","Baggy","Regular","Cropped"]}];
let ST=ld("mk-stock",{uncommon:1000,rare:100,epic:50,legendary:1}),L={i:0,a:{},force:0};
const typeIt=(el,t)=>{let i=0;el.textContent="";const x=setInterval(()=>{el.textContent=t.slice(0,++i);if(i>=t.length)clearInterval(x)},22)};
function openLucky(){L={i:0,a:{},force:0};$("#lk").classList.add("on");mg();step()}
function step(){const lk=$("#lk");if(L.i>2)return scan();const q=Q[L.i],a=L.a[q.k]||[];
 lk.innerHTML=`<button data-a="lx" class="fixed top-5 right-6 bg-transparent border-0 text-3xl text-white">×</button><div class="lq"><p class="m-0 mb-3 font-semibold" style="color:var(--g2)">feeling lucky? · 0${L.i+1}/03</p><h2 id="qt" class="d normal-case text-[clamp(26px,5vw,44px)] m-0 mb-10"></h2><div>${q.o.map(o=>`<button class="lc ${a.includes(o)?"on":""}" data-a="pick" data-v="${o}">${o}</button>`).join("")}</div>${q.m?`<input id="lt" placeholder="or type your own… (e.g. Death Note)" class="fld mt-4" style="background:#ffffff18;color:#fff">`:""}<button data-a="next" class="btn g mt-8 px-10">${L.i==2?"Unlock my drop":"Next →"}</button></div>`;typeIt($("#qt"),q.q)}
function scan(){const A=L.a,w=k=>(A[k]||["mystery"]).join(" + "),ls=[`reading your ${w("a")} energy…`,`cross-checking ${w("s")}…`,`matching ${w("f")} silhouettes…`,"checking the vault for stock…"];
 $("#lk").innerHTML=`<div class="lq"><h2 class="d normal-case text-[clamp(26px,5vw,44px)] m-0 mb-8">thinking…</h2><p id="sc" class="text-xl" style="color:var(--g2)"></p><div class="bar mt-8"><i></i></div></div>`;
 ls.forEach((t,i)=>setTimeout(()=>{const e=$("#sc");e&&typeIt(e,t)},i*600));setTimeout(reveal,2500)}
function reveal(){const av=Object.keys(R).filter(k=>ST[k]>0);let r=L.force&&ST.legendary>0?"legendary":null;
 if(!r){let t=av.reduce((a,k)=>a+R[k].w,0)*Math.random();r=av.find(k=>(t-=R[k].w)<0)||"uncommon"}
 const D=R[r],a=L.a,serial=D.t-ST[r]+1,fit=(a.f||["Oversized"])[0],name=`${(a.a||["Mystery"])[0]} ${NAMES[Math.floor(Math.random()*12)]}`,price=Math.round(1499*(1-D.off));
 ST[r]--;sv("mk-stock",ST);L.prize={key:"L"+r+serial,name,price,size:"M",fit,qty:1,rarity:r,serial};
 $("#lk").innerHTML=`<div class="fl"></div>${[...Array(8)].map((_,i)=>`<div class="sl" style="--i:${i};left:${i*12.5}%"></div>`).join("")}
 <div class="lq" style="animation:none;padding-top:9vh"><div class="pz" style="--rc:${D.c}"><div class="ph w-full flex items-end justify-center" style="aspect-ratio:300/340;background:linear-gradient(160deg,#27322c,#0c1410)"><span class="d mb-4 text-3xl" style="color:${D.c}">${r=="legendary"?"1 of 1":"#"+serial}</span></div>
 <p id="rl" class="d mt-4 mb-1 text-sm" style="color:${D.c}">· · ·</p><p class="m-0 text-xl font-semibold">${name}</p><p class="my-1 text-sm opacity-70">${fit} fit · ${serial}/${D.t} of this rarity</p>
 <p class="my-2"><s class="opacity-50">Rs. 1,499</s> <b class="text-2xl" style="color:${D.c}">${money(price)}</b> <span class="text-sm">(${D.off*100}% off)</span></p>
 <div class="flex gap-2 my-3">${["S","M","L","XL"].map(s=>`<button data-a="psz" data-v="${s}" class="lc m-0 px-4 py-2 ${s=="M"?"on":""}">${s}</button>`).join("")}</div>
 <button data-a="claim" class="btn g w-full">Add to bag</button><button data-a="lx" class="w-full bg-transparent border-0 text-white mt-3 underline">Keep shopping</button></div>
 <p class="text-center mt-6"><button data-a="redo" class="bg-transparent border-0 text-white underline">Retake quiz</button></p></div>`;
 const names=Object.values(R).map(x=>x.n);let i=0;const x=setInterval(()=>{$("#rl").textContent=names[i++%4]},60);setTimeout(()=>{clearInterval(x);const e=$("#rl");if(e)e.textContent=`${D.n} · limited to ${D.t}`},1200)}
/* actions */
const A={
 menu:()=>mg("Men"),wish:()=>toast(S.wish.size?`${S.wish.size} saved`:"Wishlist is empty"),sign:()=>$("#sp").classList.add("on"),sx:()=>$("#sp").classList.remove("on"),
 mode:()=>{const u=$("#st").textContent=="Sign in";$("#st").textContent=u?"Sign up":"Sign in";$("#sw").textContent=u?"Have an account? Sign in":"New here? Sign up"},
 in:()=>{A.sx();toast(`Welcome back, ${($("#se").value||"guest").split("@")[0]}`)},guest:()=>{A.sx();toast("Browsing as guest")},
 lucky:openLucky,lx:()=>$("#lk").classList.remove("on"),
 pick:(v,el)=>{const q=Q[L.i],a=L.a[q.k]||[];L.a[q.k]=q.m?(a.includes(v)?a.filter(x=>x!=v):[...a,v]):[v];if(q.m)el.classList.toggle("on");else{document.querySelectorAll(".lc").forEach(c=>c.classList.toggle("on",c==el));setTimeout(()=>A.next(0,0,{}),260)}},
 next:(v,el,e)=>{const q=Q[L.i],t=$("#lt");if(t&&t.value.trim())L.a[q.k]=[...(L.a[q.k]||[]),t.value.trim()];if(!(L.a[q.k]||[]).length)return toast("pick at least one");if(e&&e.shiftKey)L.force=1;L.i++;step()},
 psz:(v,el)=>{L.prize.size=v;document.querySelectorAll("[data-a=psz]").forEach(c=>c.classList.toggle("on",c==el))},
 claim:(v,el)=>{S.bag.push(L.prize);save();render();el.textContent="In your bag ✓";el.onclick=()=>{A.lx();location.hash="bag"}},
 redo:openLucky,
 cat:v=>{const g=document.querySelector(".nv.on")?.dataset.n;S.f=["Men","Women"].includes(g)?{g}:{};S.crumb=(g?g+" / ":"")+(v=="All"?"All":v);S.n=8;mg()},
 shop:v=>{S.f={};S.crumb=v;S.n=8;location.hash="shop"},
 open:v=>{S.open=S.open==v?"":v;render()},setf:v=>{const[k,x]=v.split("|");S.f[k]=x;S.open="";S.n=8;render()},sort:v=>{S.sort=v;S.open="";render()},clr:()=>{S.f={};S.open="";render()},more:()=>{S.n+=8;render()},
 heart:(v,el,e)=>{e.preventDefault();v=+v;S.wish.has(v)?S.wish.delete(v):S.wish.add(v);save();render();toast(S.wish.has(v)?"Saved to wishlist":"Removed")},
 sz:v=>{S.sz=v;render()},ft:v=>{S.ft=v;render()},acc:v=>{S.acc=S.acc==v?"":v;render()},
 add:v=>{const p=P.find(x=>x.id==v),k=`${v}${S.sz}${S.ft}`,b=S.bag.find(x=>x.key==k);b?b.qty++:S.bag.push({key:k,name:p.name,price:p.price,size:S.sz,fit:S.ft,qty:1});save();render();toast("Added to bag")},
 qty:v=>{const[i,d]=v.split("|"),b=S.bag[i];if(b.rarity&&d>0)return toast("1 of a kind — one per customer");b.qty+=+d;if(b.qty<1)S.bag.splice(i,1);save();render()},
 pay:()=>{if(!S.bag.length)return toast("Your bag is empty");S.bag=[];save();location.hash="home";render();toast("Order placed — thanks! (demo)")}};
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(el&&A[el.dataset.a])A[el.dataset.a](el.dataset.v,el,e);else if(S.open&&!e.target.closest(".ch,[data-v=sort]")){S.open="";render()}});
addEventListener("keydown",e=>{if(e.key=="Escape"){A.lx();A.sx()}});
render();
</script>
</body>
</html>
